name: ATLAS NEWS — Emergency Artifact Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-artifact-request.json"

permissions:
  contents: write

concurrency:
  group: atlas-news-emergency-artifact
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar artefacto Astro validado
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio público
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolver solicitud
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=.github/atlas-news-emergency-artifact-request.json
          source_sha="$(jq -r '.source_sha' "$req")"
          base_url="$(jq -r '.artifact_base_url' "$req" | sed 's:/*$::')"
          expected_date="$(jq -r '.date' "$req")"

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_url" =~ ^https:// ]]
          [[ "$expected_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "expected_date=$expected_date" >> "$GITHUB_OUTPUT"

      - name: Descargar y verificar status del build Astro
        id: manifest
        env:
          BASE_URL: ${{ steps.request.outputs.base_url }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EXPECTED_DATE: ${{ steps.request.outputs.expected_date }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/atlas-news-emergency-dist"
          mkdir -p "$stage"
          curl --retry 3 --retry-all-errors -fsSL "$BASE_URL/status.json" -o "$stage/status.json"

          jq -e --arg sha "$SOURCE_SHA" --arg date "$EXPECTED_DATE" '
            .schemaVersion == 1 and
            .sourceCommit == $sha and
            .morningPackage.date == $date and
            .morningPackage.generalPublished == true and
            (.morningPackage.completeness >= 1)
          ' "$stage/status.json" >/dev/null

          general_id="$(jq -r '.latestDaily.id // empty' "$stage/status.json")"
          national_published="$(jq -r '.morningPackage.nationalPublished // false' "$stage/status.json")"
          markets_published="$(jq -r '.morningPackage.marketsPublished // false' "$stage/status.json")"
          national_id=""
          markets_id=""

          [[ -n "$general_id" ]]
          if [[ "$national_published" == "true" ]]; then
            national_id="$(jq -r '.latestNational.id // empty' "$stage/status.json")"
            [[ -n "$national_id" ]]
          fi
          if [[ "$markets_published" == "true" ]]; then
            markets_id="$(jq -r '.latestMarkets.id // empty' "$stage/status.json")"
            [[ -n "$markets_id" ]]
          fi

          echo "general_id=$general_id" >> "$GITHUB_OUTPUT"
          echo "national_published=$national_published" >> "$GITHUB_OUTPUT"
          echo "markets_published=$markets_published" >> "$GITHUB_OUTPUT"
          echo "national_id=$national_id" >> "$GITHUB_OUTPUT"
          echo "markets_id=$markets_id" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Descargar superficies publicables y assets requeridos
        env:
          BASE_URL: ${{ steps.request.outputs.base_url }}
          STAGE: ${{ steps.manifest.outputs.stage }}
          GENERAL_ID: ${{ steps.manifest.outputs.general_id }}
          NATIONAL_PUBLISHED: ${{ steps.manifest.outputs.national_published }}
          MARKETS_PUBLISHED: ${{ steps.manifest.outputs.markets_published }}
          NATIONAL_ID: ${{ steps.manifest.outputs.national_id }}
          MARKETS_ID: ${{ steps.manifest.outputs.markets_id }}
        shell: bash
        run: |
          set -euo pipefail

          fetch_page() {
            local route="$1"
            local target="$2"
            local fallback
            mkdir -p "$(dirname "$target")"
            if curl --retry 2 --retry-all-errors -fsSL "$BASE_URL$route" -o "$target"; then
              test -s "$target"
              return 0
            fi
            fallback="${route%/}/index.html"
            curl --retry 2 --retry-all-errors -fsSL "$BASE_URL$fallback" -o "$target"
            test -s "$target"
          }

          fetch_page "/" "$STAGE/index.html"
          fetch_page "/archivo/" "$STAGE/archivo/index.html"
          fetch_page "/ediciones/" "$STAGE/ediciones/index.html"
          fetch_page "/estado/" "$STAGE/estado/index.html"
          fetch_page "/internacional/" "$STAGE/internacional/index.html"
          fetch_page "/ediciones/$GENERAL_ID/" "$STAGE/ediciones/$GENERAL_ID/index.html"
          fetch_page "/internacional/$GENERAL_ID/" "$STAGE/internacional/$GENERAL_ID/index.html"

          if [[ "$NATIONAL_PUBLISHED" == "true" ]]; then
            fetch_page "/nacional/" "$STAGE/nacional/index.html"
            fetch_page "/nacional/$NATIONAL_ID/" "$STAGE/nacional/$NATIONAL_ID/index.html"
          fi
          if [[ "$MARKETS_PUBLISHED" == "true" ]]; then
            fetch_page "/mercados/" "$STAGE/mercados/index.html"
            fetch_page "/mercados/$MARKETS_ID/" "$STAGE/mercados/$MARKETS_ID/index.html"
          fi

          mkdir -p "$STAGE/data"
          if ! curl --retry 1 --retry-all-errors -fsSL "$BASE_URL/data/economic-indicators.json" -o "$STAGE/data/economic-indicators.json"; then
            rm -f "$STAGE/data/economic-indicators.json"
          fi

          asset_list="$RUNNER_TEMP/atlas-assets.txt"
          grep -RhoE '(src|href)="/[^"?#]+' "$STAGE" 2>/dev/null \
            | sed -E 's/^(src|href)="//' \
            | grep -E '^/(_astro|images|brand|share-icons)/' \
            | sort -u > "$asset_list" || true

          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            target="$STAGE${asset}"
            mkdir -p "$(dirname "$target")"
            curl --retry 2 --retry-all-errors -fsSL "$BASE_URL$asset" -o "$target"
            test -s "$target"
          done < "$asset_list"

      - name: Sincronizar superficies afectadas
        env:
          STAGE: ${{ steps.manifest.outputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          test -d audio
          test -f data/funds-beagf.json
          cp -a "$STAGE/." ./
          test -d audio
          test -f data/funds-beagf.json

      - name: Commit y push público de emergencia
        id: publish
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Emergency Runner"
          git config user.email "actions@users.noreply.github.com"
          git add index.html status.json archivo ediciones estado internacional
          [[ -d nacional ]] && git add nacional || true
          [[ -d mercados ]] && git add mercados || true
          [[ -d _astro ]] && git add _astro || true
          [[ -d images ]] && git add images || true
          [[ -d brand ]] && git add brand || true
          [[ -d share-icons ]] && git add share-icons || true
          [[ -f data/economic-indicators.json ]] && git add data/economic-indicators.json || true

          if git diff --cached --quiet; then
            echo "La salida pública ya coincide con el artefacto validado."
          else
            git commit -m "EMERGENCY: Publica ATLAS NEWS desde ${SOURCE_SHA}"
            git push origin main
          fi
          echo "public_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verificar repositorio público
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          PUBLIC_COMMIT: ${{ steps.publish.outputs.public_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$PUBLIC_COMMIT" origin/main
          git show origin/main:status.json | jq -e --arg sha "$SOURCE_SHA" '.sourceCommit == $sha' >/dev/null

      - name: Verificar GitHub Pages real
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          GENERAL_ID: ${{ steps.manifest.outputs.general_id }}
          NATIONAL_PUBLISHED: ${{ steps.manifest.outputs.national_published }}
          MARKETS_PUBLISHED: ${{ steps.manifest.outputs.markets_published }}
          NATIONAL_ID: ${{ steps.manifest.outputs.national_id }}
          MARKETS_ID: ${{ steps.manifest.outputs.markets_id }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://eldesiempre100.github.io"
          ready=false
          for attempt in $(seq 1 18); do
            url="$base/status.json?source=$SOURCE_SHA&attempt=$attempt&ts=$(date +%s)"
            if curl -fsSL -H 'Cache-Control: no-cache' "$url" | jq -e --arg sha "$SOURCE_SHA" '.sourceCommit == $sha' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          [[ "$ready" == "true" ]]
          curl -fsSL "$base/" >/dev/null
          curl -fsSL "$base/ediciones/$GENERAL_ID/" >/dev/null
          curl -fsSL "$base/internacional/$GENERAL_ID/" >/dev/null
          if [[ "$NATIONAL_PUBLISHED" == "true" ]]; then
            curl -fsSL "$base/nacional/$NATIONAL_ID/" >/dev/null
          fi
          if [[ "$MARKETS_PUBLISHED" == "true" ]]; then
            curl -fsSL "$base/mercados/$MARKETS_ID/" >/dev/null
          fi
          echo "EMERGENCY_WEB_SUCCESS source_sha=$SOURCE_SHA general_id=$GENERAL_ID national=$NATIONAL_PUBLISHED markets=$MARKETS_PUBLISHED"
