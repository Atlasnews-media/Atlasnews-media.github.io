name: ATLAS NEWS — Emergency Cover Audio — 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-cover-audio-20260915.json"

permissions:
  contents: write

concurrency:
  group: atlas-news-public-audio-write
  cancel-in-progress: false

jobs:
  synthesize-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout canonical audio runtime mirror
        uses: actions/checkout@v4
        with:
          repository: Atlasnews-media/ATLAS_NEWS_V2
          ref: main
          path: .atlas-audio-runtime

      - name: Resolve and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=.github/atlas-news-emergency-cover-audio-20260915.json
          source_sha="$(jq -r '.source_sha' "$req")"
          date="$(jq -r '.date' "$req")"
          source_id="$(jq -r '.source_id' "$req")"
          generator_blob_sha="$(jq -r '.generator_blob_sha' "$req")"
          [[ "$source_sha" == "a56b180282d3dc9adfdc66689dbe02a0e7dec1d6" ]]
          [[ "$date" == "2026-09-15" ]]
          [[ "$source_id" == "2026-09-15-daily-hormuz-pierde-dos-vias-de-alivio" ]]
          [[ "$generator_blob_sha" == "aaf04f3ad16a0a0f9d1655585892e0a4804d0689" ]]
          actual_generator_sha="$(git -C .atlas-audio-runtime hash-object scripts/generate-audio-v2.py)"
          test "$actual_generator_sha" = "$generator_blob_sha"
          jq -e '.products.cover.needsGeneration == true and .products.cover.plan.date == "2026-09-15" and (.products.cover.plan.script | length > 100)' "$req" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "source_id=$source_id" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy

      - name: Preserve analysis manifest
        run: |
          set -euo pipefail
          cp audio/analysis-latest.json /tmp/analysis-latest.json
          sha256sum audio/analysis-latest.json | awk '{print $1}' > /tmp/analysis.sha

      - name: Synthesize cover audio
        env:
          ATLAS_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ATLAS_AUDIO_V2_PLAN: ${{ github.workspace }}/.github/atlas-news-emergency-cover-audio-20260915.json
          ATLAS_PUBLIC_REPO_DIR: ${{ github.workspace }}
          ATLAS_AUDIO_SPEED: "1.0"
          PYTHONPATH: ${{ github.workspace }}/.atlas-audio-runtime/scripts
        run: |
          set -euo pipefail
          python .atlas-audio-runtime/scripts/generate-audio-v2.py
          cp /tmp/analysis-latest.json audio/analysis-latest.json
          test "$(sha256sum audio/analysis-latest.json | awk '{print $1}')" = "$(cat /tmp/analysis.sha)"

      - name: Verify generated cover contract
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          SOURCE_ID: ${{ steps.request.outputs.source_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" --arg source "$SOURCE_ID" '
            .date == $date and
            .sourceCommit == $sha and
            .status == "published" and
            .path == ("/audio/" + $date + "-resumen-diario.mp3") and
            .sourceIds.general == $source and
            .sourceIds.international == $source and
            .sourceIds.national == null and
            .sourceIds.markets == null
          ' audio/latest.json >/dev/null
          test -s "audio/$DATE-resumen-diario.mp3"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "audio/$DATE-resumen-diario.mp3")"
          awk -v d="$duration" 'BEGIN { exit !(d > 60) }'
          echo "cover_duration_seconds=$duration"

      - name: Publish cover audio atomically
        env:
          DATE: ${{ steps.request.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .atlas-audio-runtime
          git config user.name "ATLAS NEWS Emergency Audio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/latest.json "audio/$DATE-resumen-diario.mp3"
          git commit -m "EMERGENCY: Audio Portada ATLAS NEWS — $DATE"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify committed cover manifest
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git show origin/main:audio/latest.json | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.date == $date and .sourceCommit == $sha and .status == "published"' >/dev/null
          test "$(git show origin/main:audio/analysis-latest.json | sha256sum | awk '{print $1}')" = "$(cat /tmp/analysis.sha)"

      - name: Verify GitHub Pages cover audio readiness
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://eldesiempre100.github.io"
          ready=false
          for attempt in $(seq 1 18); do
            cache="?cover_audio=${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL -H 'Cache-Control: no-cache' "$base/audio/latest.json$cache" | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.date == $date and .sourceCommit == $sha and .status == "published"' >/dev/null 2>&1; then
              if curl -fsSL -o /tmp/cover.mp3 "$base/audio/$DATE-resumen-diario.mp3$cache" && test -s /tmp/cover.mp3; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$ready" == "true" ]]
          bytes="$(wc -c < /tmp/cover.mp3)"
          test "$bytes" -gt 10000
          echo "EMERGENCY_COVER_AUDIO_SUCCESS source_sha=$SOURCE_SHA date=$DATE bytes=$bytes"
