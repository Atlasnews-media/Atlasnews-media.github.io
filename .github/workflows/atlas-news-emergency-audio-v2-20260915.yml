name: ATLAS NEWS — Emergency Audio V2 — 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-audio-v2-20260915.json"

permissions:
  contents: write

concurrency:
  group: atlas-news-public-audio-write
  cancel-in-progress: false

jobs:
  synthesize-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout canonical audio runtime mirror
        uses: actions/checkout@v4
        with:
          repository: Atlasnews-media/ATLAS_NEWS_V2
          ref: main
          path: .atlas-audio-runtime

      - name: Resolve and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=.github/atlas-news-emergency-audio-v2-20260915.json
          source_sha="$(jq -r '.source_sha' "$req")"
          date="$(jq -r '.date' "$req")"
          source_id="$(jq -r '.source_id' "$req")"
          generator_blob_sha="$(jq -r '.generator_blob_sha' "$req")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$date" == "2026-09-15" ]]
          [[ "$source_id" == "2026-09-15-daily-hormuz-pierde-dos-vias-de-alivio" ]]
          [[ "$generator_blob_sha" == "aaf04f3ad16a0a0f9d1655585892e0a4804d0689" ]]
          actual_generator_sha="$(git -C .atlas-audio-runtime hash-object scripts/generate-audio-v2.py)"
          test "$actual_generator_sha" = "$generator_blob_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "source_id=$source_id" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy

      - name: Preserve current cover manifest identity
        id: cover_before
        shell: bash
        run: |
          set -euo pipefail
          test -f audio/latest.json
          echo "sha=$(sha256sum audio/latest.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Synthesize only corresponding Audio V2 products
        env:
          ATLAS_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ATLAS_AUDIO_V2_PLAN: ${{ github.workspace }}/.github/atlas-news-emergency-audio-v2-20260915.json
          ATLAS_PUBLIC_REPO_DIR: ${{ github.workspace }}
          ATLAS_AUDIO_SPEED: "1.0"
          PYTHONPATH: ${{ github.workspace }}/.atlas-audio-runtime/scripts
        run: |
          set -euo pipefail
          python .atlas-audio-runtime/scripts/generate-audio-v2.py

      - name: Verify generated contract
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          SOURCE_ID: ${{ steps.request.outputs.source_id }}
          COVER_BEFORE: ${{ steps.cover_before.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum audio/latest.json | awk '{print $1}')" = "$COVER_BEFORE"
          jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" --arg source "$SOURCE_ID" '
            .date == $date and
            .sourceCommit == $sha and
            .international.status == "published" and
            .international.sourceId == $source and
            .international.path == ("/audio/" + $date + "-international-analysis.mp3") and
            .national.status == "unavailable" and
            .national.reason == "source_missing" and
            .markets.status == "unavailable" and
            .markets.reason == "source_missing"
          ' audio/analysis-latest.json >/dev/null
          test -s "audio/$DATE-international-analysis.mp3"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "audio/$DATE-international-analysis.mp3")"
          awk -v d="$duration" 'BEGIN { exit !(d > 5) }'
          echo "international_duration_seconds=$duration"

      - name: Publish International + analysis manifest atomically
        env:
          DATE: ${{ steps.request.outputs.date }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .atlas-audio-runtime
          git config user.name "ATLAS NEWS Emergency Audio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/analysis-latest.json "audio/$DATE-international-analysis.mp3"
          if git diff --cached --quiet; then
            echo "No hay cambios de audio por publicar."
          else
            git commit -m "EMERGENCY: Audio V2 ATLAS NEWS — $DATE — Internacional"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "public_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify committed manifests
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          SOURCE_ID: ${{ steps.request.outputs.source_id }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git show origin/main:audio/analysis-latest.json | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" --arg source "$SOURCE_ID" '
            .date == $date and .sourceCommit == $sha and
            .international.status == "published" and .international.sourceId == $source and
            .national.status == "unavailable" and .markets.status == "unavailable"
          ' >/dev/null
          git show origin/main:audio/latest.json | jq -e '.date == "2026-09-14"' >/dev/null

      - name: Verify GitHub Pages audio readiness
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          SOURCE_ID: ${{ steps.request.outputs.source_id }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://eldesiempre100.github.io"
          ready=false
          for attempt in $(seq 1 18); do
            cache="?audio_v2=${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL -H 'Cache-Control: no-cache' "$base/audio/analysis-latest.json$cache" | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" --arg source "$SOURCE_ID" '
              .date == $date and .sourceCommit == $sha and
              .international.status == "published" and .international.sourceId == $source and
              .national.status == "unavailable" and .markets.status == "unavailable"
            ' >/dev/null 2>&1; then
              if curl -fsSL -o /tmp/international.mp3 "$base/audio/$DATE-international-analysis.mp3$cache" && test -s /tmp/international.mp3; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$ready" == "true" ]]
          bytes="$(wc -c < /tmp/international.mp3)"
          test "$bytes" -gt 10000
          echo "EMERGENCY_AUDIO_V2_SUCCESS source_sha=$SOURCE_SHA date=$DATE international_bytes=$bytes"
