name: ATLAS NEWS — Emergency Nacional + Mercados V2 — 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-nm-v2-20260915.json"

permissions:
  contents: write

concurrency:
  group: atlas-news-public-emergency-nm
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=.github/atlas-news-emergency-nm-v2-20260915.json
          mode="$(jq -r '.mode' "$req")"
          source_sha="$(jq -r '.source_sha' "$req")"
          national_id="$(jq -r '.national_id' "$req")"
          markets_id="$(jq -r '.markets_id' "$req")"
          [[ "$mode" == "validate" || "$mode" == "publish" ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$national_id" == "2026-09-15-national-credito-tasas-economia-debil" ]]
          [[ "$markets_id" == "2026-09-15-markets-treasury-petroleo-fed" ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "national_id=$national_id" >> "$GITHUB_OUTPUT"
          echo "markets_id=$markets_id" >> "$GITHUB_OUTPUT"

      - name: Checkout source mirror
        uses: actions/checkout@v4
        with:
          repository: Atlasnews-media/ATLAS_NEWS_V2
          ref: main
          path: .atlas-source

      - name: Overlay canonical recent editorial files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a .github/emergency-source/ .atlas-source/
          test -f .atlas-source/src/content/editions/2026-09-15-daily-hormuz-pierde-dos-vias-de-alivio.md
          test -f .atlas-source/src/content/briefings/2026-09-15-national-credito-tasas-economia-debil.md
          test -f .atlas-source/src/content/briefings/2026-09-15-markets-treasury-petroleo-fed.md

      - name: Setup Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: .atlas-source/package-lock.json

      - name: Install dependencies
        working-directory: .atlas-source
        run: npm ci

      - name: Validate and build reconstructed source
        working-directory: .atlas-source
        env:
          ATLAS_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: npm run build

      - name: Verify editorial contract and routes
        env:
          NATIONAL_ID: ${{ steps.request.outputs.national_id }}
          MARKETS_ID: ${{ steps.request.outputs.markets_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          dist=.atlas-source/dist
          test -f "$dist/nacional/$NATIONAL_ID/index.html"
          test -f "$dist/mercados/$MARKETS_ID/index.html"
          jq -e --arg sha "$SOURCE_SHA" --arg n "$NATIONAL_ID" --arg m "$MARKETS_ID" '
            .sourceCommit == $sha and
            .latestDaily.id == "2026-09-15-daily-hormuz-pierde-dos-vias-de-alivio" and
            .latestDaily.issueNumber == 44 and
            .latestNational.id == $n and
            .latestMarkets.id == $m and
            .morningPackage.date == "2026-09-15" and
            .morningPackage.generalPublished == true and
            .morningPackage.nationalPublished == true and
            .morningPackage.marketsPublished == true and
            .morningPackage.completeness == 3 and
            .publications.daily == 44 and
            .publications.national == 37 and
            .publications.markets == 36 and
            .publications.readings == 10 and
            .publications.total == 131
          ' "$dist/status.json" >/dev/null
          echo "EMERGENCY_NM_VALIDATED source_sha=$SOURCE_SHA"

      - name: Publish Nacional and Mercados without regressing live site
        if: steps.request.outputs.mode == 'publish'
        env:
          NATIONAL_ID: ${{ steps.request.outputs.national_id }}
          MARKETS_ID: ${{ steps.request.outputs.markets_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          dist=.atlas-source/dist
          mkdir -p nacional mercados _astro
          rsync -a "$dist/nacional/" nacional/
          rsync -a "$dist/mercados/" mercados/
          rsync -a "$dist/_astro/" _astro/

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
            '/nacional/2026-09-14-national-basilea-supervision-riesgo/': '/nacional/2026-09-15-national-credito-tasas-economia-debil/',
            'La CMF ajusta Basilea III y acelera una supervisión financiera basada en riesgo': 'Nuevas tasas de crédito entran a regir con una economía chilena más débil',
            '/mercados/2026-09-14-markets-doble-prima-energia-ia/': '/mercados/2026-09-15-markets-treasury-petroleo-fed/',
            'Energía e inteligencia artificial abren dos primas de riesgo distintas': 'Treasury sobre 5% y petróleo sobre US$100 endurecen el costo de capital antes de la Fed',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'No se encontró patrón de portada: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

          jq --arg sha "$SOURCE_SHA" --arg n "$NATIONAL_ID" --arg m "$MARKETS_ID" '
            .sourceCommit = $sha |
            .latestNational = {id:$n,title:"Nuevas tasas de crédito entran a regir con una economía chilena más débil",publishedAt:"2026-09-15T10:31:00-03:00",cutoffAt:"2026-09-15T10:28:00-03:00"} |
            .latestMarkets = {id:$m,title:"Treasury sobre 5% y petróleo sobre US$100 endurecen el costo de capital antes de la Fed",publishedAt:"2026-09-15T10:31:30-03:00",cutoffAt:"2026-09-15T10:28:00-03:00"} |
            .morningPackage.nationalPublished = true |
            .morningPackage.marketsPublished = true |
            .morningPackage.completeness = 3 |
            .publications.national = 37 |
            .publications.markets = 36 |
            .publications.total = 131
          ' status.json > status.json.tmp
          mv status.json.tmp status.json

          git config user.name "ATLAS NEWS Emergency Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html status.json nacional mercados _astro
          if ! git diff --cached --quiet; then
            git commit -m "EMERGENCY: publica Nacional y Mercados 2026-09-15 desde ${SOURCE_SHA:0:7}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify GitHub Pages readiness
        if: steps.request.outputs.mode == 'publish'
        env:
          NATIONAL_ID: ${{ steps.request.outputs.national_id }}
          MARKETS_ID: ${{ steps.request.outputs.markets_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://eldesiempre100.github.io"
          ready=false
          for attempt in $(seq 1 18); do
            cache="?nm=${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL -H 'Cache-Control: no-cache' "$base/status.json$cache" | jq -e --arg sha "$SOURCE_SHA" --arg n "$NATIONAL_ID" --arg m "$MARKETS_ID" '
              .sourceCommit == $sha and .latestNational.id == $n and .latestMarkets.id == $m and .morningPackage.completeness == 3
            ' >/dev/null 2>&1; then
              if curl -fsSL -o /dev/null "$base/nacional/$NATIONAL_ID/$cache" && curl -fsSL -o /dev/null "$base/mercados/$MARKETS_ID/$cache" && curl -fsSL -H 'Cache-Control: no-cache' "$base/$cache" | grep -Fq "$NATIONAL_ID" && curl -fsSL -H 'Cache-Control: no-cache' "$base/$cache" | grep -Fq "$MARKETS_ID"; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$ready" == "true" ]]
          echo "EMERGENCY_NM_PUBLISHED source_sha=$SOURCE_SHA national=$NATIONAL_ID markets=$MARKETS_ID"
