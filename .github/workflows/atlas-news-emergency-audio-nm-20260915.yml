name: ATLAS NEWS — Emergency Audio V2 Nacional + Mercados — 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-audio-nm-20260915.json"

permissions:
  contents: write

concurrency:
  group: atlas-news-public-audio-write
  cancel-in-progress: false

jobs:
  synthesize-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout canonical audio runtime mirror
        uses: actions/checkout@v4
        with:
          repository: Atlasnews-media/ATLAS_NEWS_V2
          ref: main
          path: .atlas-audio-runtime

      - name: Resolve and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=.github/atlas-news-emergency-audio-nm-20260915.json
          source_sha="$(jq -r '.source_sha' "$req")"
          date="$(jq -r '.date' "$req")"
          national_id="$(jq -r '.sourceIds.national' "$req")"
          markets_id="$(jq -r '.sourceIds.markets' "$req")"
          generator_blob_sha="$(jq -r '.generator_blob_sha' "$req")"
          [[ "$source_sha" == "c5eceec101e3746c9f4619ee78943f7c06813ef9" ]]
          [[ "$date" == "2026-09-15" ]]
          [[ "$national_id" == "2026-09-15-national-credito-tasas-economia-debil" ]]
          [[ "$markets_id" == "2026-09-15-markets-treasury-petroleo-fed" ]]
          [[ "$generator_blob_sha" == "aaf04f3ad16a0a0f9d1655585892e0a4804d0689" ]]
          actual_generator_sha="$(git -C .atlas-audio-runtime hash-object scripts/generate-audio-v2.py)"
          test "$actual_generator_sha" = "$generator_blob_sha"
          jq -e '.products.national.needsGeneration == true and .products.markets.needsGeneration == true and .products.international.needsGeneration == false and .products.cover.needsGeneration == false' "$req" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "national_id=$national_id" >> "$GITHUB_OUTPUT"
          echo "markets_id=$markets_id" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy

      - name: Preserve existing valid products
        id: before
        shell: bash
        run: |
          set -euo pipefail
          test -f audio/latest.json
          test -f audio/analysis-latest.json
          test -f audio/2026-09-15-international-analysis.mp3
          echo "cover_sha=$(sha256sum audio/latest.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "international_sha=$(sha256sum audio/2026-09-15-international-analysis.mp3 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Synthesize Nacional and Mercados
        env:
          ATLAS_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ATLAS_AUDIO_V2_PLAN: ${{ github.workspace }}/.github/atlas-news-emergency-audio-nm-20260915.json
          ATLAS_PUBLIC_REPO_DIR: ${{ github.workspace }}
          ATLAS_AUDIO_SPEED: "1.0"
          PYTHONPATH: ${{ github.workspace }}/.atlas-audio-runtime/scripts
        run: |
          set -euo pipefail
          python .atlas-audio-runtime/scripts/generate-audio-v2.py

      - name: Verify generated contract
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          NATIONAL_ID: ${{ steps.request.outputs.national_id }}
          MARKETS_ID: ${{ steps.request.outputs.markets_id }}
          COVER_BEFORE: ${{ steps.before.outputs.cover_sha }}
          INTERNATIONAL_BEFORE: ${{ steps.before.outputs.international_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum audio/latest.json | awk '{print $1}')" = "$COVER_BEFORE"
          test "$(sha256sum audio/$DATE-international-analysis.mp3 | awk '{print $1}')" = "$INTERNATIONAL_BEFORE"
          jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" --arg n "$NATIONAL_ID" --arg m "$MARKETS_ID" '
            .date == $date and
            .sourceCommit == $sha and
            .international.status == "published" and
            .international.sourceId == "2026-09-15-daily-hormuz-pierde-dos-vias-de-alivio" and
            .national.status == "published" and
            .national.sourceId == $n and
            .national.path == ("/audio/" + $date + "-national-analysis.mp3") and
            .markets.status == "published" and
            .markets.sourceId == $m and
            .markets.path == ("/audio/" + $date + "-markets-analysis.mp3")
          ' audio/analysis-latest.json >/dev/null
          for section in national markets; do
            file="audio/$DATE-$section-analysis.mp3"
            test -s "$file"
            bytes="$(wc -c < "$file")"
            test "$bytes" -gt 10000
            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$file")"
            awk -v d="$duration" 'BEGIN { exit !(d > 5) }'
            echo "$section duration=$duration bytes=$bytes"
          done

      - name: Publish Nacional and Mercados audio atomically
        env:
          DATE: ${{ steps.request.outputs.date }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .atlas-audio-runtime
          git config user.name "ATLAS NEWS Emergency Audio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/analysis-latest.json "audio/$DATE-national-analysis.mp3" "audio/$DATE-markets-analysis.mp3"
          if ! git diff --cached --quiet; then
            git commit -m "EMERGENCY: Audio V2 Nacional y Mercados — $DATE — ${SOURCE_SHA:0:7}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify committed manifests
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          NATIONAL_ID: ${{ steps.request.outputs.national_id }}
          MARKETS_ID: ${{ steps.request.outputs.markets_id }}
          COVER_BEFORE: ${{ steps.before.outputs.cover_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git show origin/main:audio/analysis-latest.json | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" --arg n "$NATIONAL_ID" --arg m "$MARKETS_ID" '
            .date == $date and .sourceCommit == $sha and
            .international.status == "published" and
            .national.status == "published" and .national.sourceId == $n and
            .markets.status == "published" and .markets.sourceId == $m
          ' >/dev/null
          git show origin/main:audio/latest.json | sha256sum | awk -v expected="$COVER_BEFORE" '{exit !($1==expected)}'

      - name: Verify GitHub Pages audio readiness
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          NATIONAL_ID: ${{ steps.request.outputs.national_id }}
          MARKETS_ID: ${{ steps.request.outputs.markets_id }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://eldesiempre100.github.io"
          ready=false
          for attempt in $(seq 1 24); do
            cache="?audio_nm=${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL -H 'Cache-Control: no-cache' "$base/audio/analysis-latest.json$cache" | jq -e --arg sha "$SOURCE_SHA" --arg n "$NATIONAL_ID" --arg m "$MARKETS_ID" '
              .sourceCommit == $sha and .national.status == "published" and .national.sourceId == $n and .markets.status == "published" and .markets.sourceId == $m
            ' >/dev/null 2>&1; then
              if curl -fsSL -o /tmp/national.mp3 "$base/audio/$DATE-national-analysis.mp3$cache" && test -s /tmp/national.mp3 && curl -fsSL -o /tmp/markets.mp3 "$base/audio/$DATE-markets-analysis.mp3$cache" && test -s /tmp/markets.mp3; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$ready" == "true" ]]
          test "$(wc -c < /tmp/national.mp3)" -gt 10000
          test "$(wc -c < /tmp/markets.mp3)" -gt 10000
          echo "EMERGENCY_AUDIO_NM_SUCCESS source_sha=$SOURCE_SHA national=$NATIONAL_ID markets=$MARKETS_ID"
